[package]
name = "melo-lightweight"
version = "0.1.0"
description = "Windows-first lightweight MELO desktop build (Tauri 2 + WebView2)"
authors = ["prr006"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "melo_lightweight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
anyhow = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
